openapi: 3.0.3
info:
  title: Klaro API (Uploads & Scheduling)
  version: 1.0.0
servers:
  - url: /
paths:
  /api/auth/signin:
    get:
      summary: Initiate OAuth sign-in flow
      description: Redirects user to Discord or Google OAuth provider
      parameters:
        - in: query
          name: provider
          required: true
          schema:
            type: string
            enum:
              - discord
              - google
          description: OAuth provider to use
      responses:
        '302':
          description: Redirect to OAuth provider
        '400':
          description: Invalid provider parameter
  /api/auth/logout:
    post:
      summary: Invalidate session & logout user
      description: Clears authentication session and removes httpOnly cookie
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/uploads/sign:
    get:
      summary: Get Cloudinary signed params for client upload
      description: Returns signed parameters for direct client-to-Cloudinary uploads
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Signed params
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                    example: "123456789"
                  cloudName:
                    type: string
                    example: "demo"
                  timestamp:
                    type: integer
                    example: 1618884477
                  signature:
                    type: string
                    example: "abcdef123456"
                  uploadPreset:
                    type: string
                    nullable: true
                    example: "preset"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/uploads/server:
    post:
      summary: Upload file server-side to Cloudinary & save to DB
      description: Authenticated endpoint to upload file directly to Cloudinary and store metadata in database. User ID extracted from session.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload (max 50MB, allowed types JPEG/PNG/WebP/PDF)
              required:
                - file
      responses:
        '201':
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  userId:
                    type: string
                  fileName:
                    type: string
                  url:
                    type: string
                  mimeType:
                    type: string
                  size:
                    type: integer
                  createdAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid request (missing file)
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '413':
          description: File too large (max 50MB)
        '415':
          description: Invalid file type
  /api/uploads/{id}:
    get:
      summary: Get upload metadata by id
      description: Retrieve upload metadata. User can only access documents they own.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Document ID
      responses:
        '200':
          description: Upload metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  userId:
                    type: string
                  fileName:
                    type: string
                  url:
                    type: string
                  mimeType:
                    type: string
                  size:
                    type: integer
                  createdAt:
                    type: string
                    format: date-time
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden - document owned by another user
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
        '404':
          description: Document not found
  /api/documents/scan:
    get:
      summary: Get document scan endpoint metadata
      description: Returns information about the /api/documents/scan endpoint
      responses:
        '200':
          description: Endpoint metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint:
                    type: string
                    example: /api/documents/scan
                  method:
                    type: string
                    example: POST
                  description:
                    type: string
                  contentType:
                    type: string
                    example: multipart/form-data
    post:
      summary: Upload and scan medical documents
      description: Authenticated endpoint to upload medical documents (images or PDFs) and initiate OCR processing. Returns document and analysis IDs.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Medical document file (JPEG, PNG, WebP, or PDF)
              required:
                - file
      responses:
        '201':
          description: Document created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: 123e4567-e89b-12d3-a456-426614174000
                  analysisId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - uploaded
                      - processing
                    example: uploaded
                  message:
                    type: string
                  file:
                    type: object
                    properties:
                      name:
                        type: string
                      size:
                        type: integer
                      type:
                        type: string
        '400':
          description: Bad request (missing file, unsupported type)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "File type not supported. Allowed: JPEG, PNG, WebP, PDF"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '413':
          description: Payload too large (file exceeds 50MB)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: File size exceeds 50MB limit
        '500':
          description: Internal server error
  /api/scheduling/create:
    post:
      summary: Create Cal.com scheduling link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                providerId:
                  type: string
                duration:
                  type: integer
      responses:
        '200':
          description: Scheduling link
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
  /api/scheduling/webhook:
    post:
      summary: Cal.com webhook receiver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
  /api/trpc/health:
    post:
      summary: Health check
      description: Returns API health and version metadata
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time
  /api/trpc/version:
    post:
      summary: API version
      description: Returns API version metadata
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time
  /api/trpc/me:
    post:
      summary: Get current user
      description: Returns authenticated user profile basics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/trpc/documents.list:
    post:
      summary: List user documents
      description: Returns paginated documents for the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  example: 10
                offset:
                  type: integer
                  example: 0
      responses:
        '200':
          description: User documents
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    fileName:
                      type: string
                    mimeType:
                      type: string
                    fileSize:
                      type: integer
                    storageUrl:
                      type: string
                    status:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /api/trpc/documents.setOcrResult:
    post:
      summary: Attach OCR result to a document
      description: Stores OCR text/blocks for a document and marks it as processing.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentId:
                  type: string
                  format: uuid
                ocrText:
                  type: string
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                source:
                  type: string
                  enum: [local, cloud]
                blocks:
                  type: array
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      confidence:
                        type: number
                        minimum: 0
                        maximum: 1
              required:
                - documentId
                - ocrText
      responses:
        '200':
          description: OCR result stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
        '401':
          description: Not authenticated
        '403':
          description: Forbidden
  /api/trpc/documents.processServerOcr:
    post:
      summary: Process document image with OCR (server-side)
      description: Runs local OCR with optional cloud fallback and extracts tests.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentId:
                  type: string
                  format: uuid
                base64Image:
                  type: string
                  description: Base64-encoded image payload (no data URI prefix).
              required:
                - documentId
                - base64Image
      responses:
        '200':
          description: OCR processed and extraction results returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  ocrResult:
                    type: object
                    properties:
                      text:
                        type: string
                      confidence:
                        type: number
                      source:
                        type: string
                        enum: [local, cloud]
                  extractedTests:
                    type: array
                    items:
                      type: object
        '401':
          description: Not authenticated
        '403':
          description: Forbidden
  /api/trpc/documents.runExtraction:
    post:
      summary: Extract lab test values from OCR text
      description: Runs rule-based + regex extraction on OCR text to produce structured test results. Supports Philippine lab formats with test name canonicalization and abnormal value flagging.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentId:
                  type: string
                  format: uuid
                  description: Document ID with OCR text
                ocrText:
                  type: string
                  description: Optional override OCR text (uses stored text if not provided)
              required:
                - documentId
      responses:
        '200':
          description: Extraction completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysisId:
                    type: string
                    format: uuid
                  extractedCount:
                    type: integer
                    description: Number of tests extracted
                    example: 12
                  flaggedCount:
                    type: integer
                    description: Number of tests with abnormal values
                    example: 3
                  accuracy:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: Extraction confidence score
                    example: 0.95
                  method:
                    type: string
                    enum: [regex, llm, hybrid]
                    description: Extraction method used
                    example: regex
        '400':
          description: Bad request (OCR text missing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "OCR text is required before extraction"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden (no access to document)
        '404':
          description: Not found (document or analysis record not found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Analysis record not found"
  /api/trpc/documents.generateAnalysis:
    post:
      summary: Generate plain-language analysis (LLM)
      description: Generates plain-language medical explanations, questions to ask doctor, and severity scores using LLM service. Requires extraction to be complete.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentId:
                  type: string
                  format: uuid
                  description: Document ID with extracted tests
                dialect:
                  type: string
                  enum: [Filipino, Bisaya, Ilocano]
                  default: Filipino
                  description: Target dialect for explanations
              required:
                - documentId
      responses:
        '200':
          description: Analysis generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysisId:
                    type: string
                    format: uuid
                  summary:
                    type: string
                    description: Plain-language summary of results (max 500 chars, grade 8 reading level)
                    example: "Maganda! Ang lahat ng results ay normal."
                  tests:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: "White Blood Cell Count"
                        value:
                          type: string
                          example: "7.5 K/uL"
                        interpretation:
                          type: string
                          description: Plain-language interpretation
                        recommendation:
                          type: string
                          description: Suggested action if abnormal
                  tanqmoCard:
                    type: object
                    description: "Itatanong Mo Sa Doktor (Questions to Ask Doctor) card"
                    properties:
                      title:
                        type: string
                        example: "Itatanong Mo Sa Doktor"
                      questions:
                        type: array
                        items:
                          type: string
                          maxLength: 100
                        minItems: 1
                        maxItems: 5
                        example: ["Bakit mataas ang aking leukocytes?", "Kailangan ko ba ng gamot?"]
                      severity:
                        type: string
                        enum: [LOW, MODERATE, HIGH]
                        example: "MODERATE"
                      disclaimer:
                        type: string
                        description: Safety disclaimer (shown if severity is HIGH)
                        example: "⚠️ May abnormal na resulta. Dapat makita ang doktor."
                      bookingCta:
                        type: string
                        description: Call-to-action for booking (shown if severity is HIGH)
                        example: "📞 Mag-book ng appointment sa doktor ngayon"
                  severity:
                    type: string
                    enum: [LOW, MODERATE, HIGH]
                    description: Overall severity assessment
                    example: "MODERATE"
                  dialect:
                    type: string
                    enum: [Filipino, Bisaya, Ilocano]
                    example: "Filipino"
        '400':
          description: Bad request (extraction not complete)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Document must be extracted before analysis can be generated"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden (no access to document)
        '404':
          description: Not found (document or analysis record not found)
        '500':
          description: Internal server error (LLM API call failed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to generate analysis: API rate limit exceeded"
  /api/trpc/chat.sendMessage:
    post:
      summary: Send a chat message about an analysis
      description: Creates a user message, assembles recent document context, and returns an assistant response with a follow-up question. High-severity analyses prepend safety guidance and a booking suggestion.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                analysisId:
                  type: string
                  format: uuid
                  description: Analysis record to chat about
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  example: "Ano ibig sabihin ng WBC ko?"
                dialect:
                  type: string
                  enum: [Filipino, Bisaya, Ilocano]
                  default: Filipino
                  example: Filipino
              required:
                - analysisId
                - content
      responses:
        '200':
          description: Assistant response generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  userMessage:
                    type: object
                    properties:
                      role:
                        type: string
                        example: user
                      content:
                        type: string
                      dialect:
                        type: string
                        enum: [Filipino, Bisaya, Ilocano]
                  assistantMessage:
                    type: object
                    properties:
                      role:
                        type: string
                        example: assistant
                      content:
                        type: string
                        example: "Mukhang normal ang karamihan ng resulta mo. May nararamdaman ka bang iba?"
                      dialect:
                        type: string
                        enum: [Filipino, Bisaya, Ilocano]
                  suggestedActions:
                    type: array
                    items:
                      type: string
                    example: ["continueChat"]
                  safety:
                    type: object
                    properties:
                      severity:
                        type: string
                        enum: [LOW, MODERATE, HIGH]
                      disclaimer:
                        type: string
                      bookingSuggestion:
                        type: string
              examples:
                default:
                  value:
                    userMessage:
                      role: user
                      content: "Ano ibig sabihin ng WBC ko?"
                      dialect: Filipino
                    assistantMessage:
                      role: assistant
                      content: "Mukhang normal ang karamihan ng resulta mo. May nararamdaman ka bang iba?"
                      dialect: Filipino
                    suggestedActions:
                      - continueChat
                    safety:
                      severity: LOW
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "content must be at least 1 character"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Forbidden - analysis owned by another user
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
  /api/trpc/chat.getHistory:
    post:
      summary: Get chat history for an analysis
      description: Returns the stored chat transcript for the authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                analysisId:
                  type: string
                  format: uuid
                limit:
                  type: integer
                  minimum: 1
                  maximum: 200
                  default: 50
              required:
                - analysisId
      responses:
        '200':
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    role:
                      type: string
                    content:
                      type: string
                    dialect:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
        '401':
          description: Not authenticated
        '403':
          description: Forbidden - analysis owned by another user
  /api/trpc/chat.clearHistory:
    post:
      summary: Clear chat history for an analysis
      description: Deletes all stored chat messages for the authenticated user and analysis.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                analysisId:
                  type: string
                  format: uuid
              required:
                - analysisId
      responses:
        '200':
          description: Chat history cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: Not authenticated
        '403':
          description: Forbidden - analysis owned by another user
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: better-auth session token (stored in secure httpOnly cookie, transmitted via Authorization header)
